# Walker v2 config. Everything not set here falls back to walker's built-in
# defaults: https://github.com/abenz1267/walker/blob/master/resources/config.toml
theme = "tui"
keybind_symbols = false # plain "ctrl e" style hints read better in a TUI footer

[placeholders]
"default" = { input = "search", list = "no results" }
