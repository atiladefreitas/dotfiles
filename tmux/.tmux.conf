#!/usr/bin/env bash

# Terminal settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# Append truecolor for ANY outer terminal (kitty/wezterm/ghostty/alacritty/...)
set -as terminal-features ',*:RGB'

# Allow kitty graphics protocol passthrough (for image.nvim)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Prefix settings
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split pane bindings
unbind %
bind | split-window -h

unbind -n M-s
unbind -n C-s
# Session picker: show "running on <port>" for sessions with a listening node
# server (@node_port is refreshed right before the picker opens)
bind -n M-s {
  run-shell "~/dotfiles/tmux/scripts/session-port.sh"
  choose-session -F "#{?window_format,#{window_name}#{window_flags},#{session_windows} windows#{?session_attached, (attached),}#{?@node_port,#[fg=#b8bb26]  #{@node_port},}}"
}

# In the session picker, cmd+k stops the node server of the highlighted session
# (panes stay open). kitty maps cmd+k to \e[9001~, registered here as User0.
# Tree mode keys aren't rebindable, so this drives its ":" prompt, where %%
# expands to the highlighted item. Outside the picker it does nothing.
set -s user-keys[0] "\e[9001~"
bind -n User0 if -F "#{==:#{pane_mode},tree-mode}" {
  send-keys -K :
  run-shell -b "~/dotfiles/tmux/scripts/picker-stop-server.sh '#{client_name}'"
}

unbind -n M-t
bind -n M-t new-window

unbind -n C-t
bind -n C-t new-window  

unbind -n C-q
bind -n C-q kill-window  

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6

bind -n M-7 resize-pane -D 5
bind -n M-8 resize-pane -U 5
bind -n M-9 resize-pane -R 5
bind -n M-0 resize-pane -L 5

unbind '"'
bind - split-window -v

# Reload config
unbind r
bind r source-file ~/.tmux.conf

# Resize panes
bind -r 7 resize-pane -D 5
bind -r 8 resize-pane -U 5
bind -r 9 resize-pane -R 5
bind -r 0 resize-pane -L 5

# Pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Toggle pane zoom
bind -r m resize-pane -Z

# Mouse support
set -g mouse on

# Window indexing and renumbering
set -g base-index 1
set -g renumber-windows on

# Use vi keys in copy mode
set-window-option -g mode-keys vi

# Copy mode bindings
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Reduce ESC delay
set -sg escape-time 10

# open open code in current directori in a popup
bind C-o popup -E -d "#{pane_current_path}" -w 90% -h 90% "opencode"

# open opencode in right pane with 25% width
bind O split-window -h -p 40 -c "#{pane_current_path}" "opencode"
bind -n M-o split-window -h -p 40 -c "#{pane_current_path}" "opencode"

# TPM plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'

set-option -g status-position top

# Single-row status (clear any prior padding row)
set -g status on

# Colors, status-bar formats and borders live in gruvbox.conf
source-file ~/dotfiles/tmux/gruvbox.conf

# Refresh status every 5s so the branch stays current
set -g status-interval 5

# Tab title: current folder when idle (shell or nvim), process name when something is running
# (kept as is while the sidebar is the active pane)
set -g automatic-rename on
set -g automatic-rename-format '#{?#{@sidebar},#W,#{?#{||:#{m:zsh,#{pane_current_command}},#{||:#{m:bash,#{pane_current_command}},#{m:nvim,#{pane_current_command}}}},#{b:pane_current_path},#{pane_current_command}}}'

# ── Session sidebar ─────────────────────────────────────────────────
# Left pane in every window listing all sessions with their dev servers and
# AI agents (scripts/sidebar-ui.zsh). Reach it with C-h (see the end of this
# file) or a click. prefix b shows/hides it everywhere; drag its border to
# change the width of all of them.
set -goq @sidebar-enabled 1
set -goq @sidebar-width 34
set -goq @sidebar-agent-command claude
set -g focus-events on
bind b run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh toggle"
bind -n MouseDragEnd1Border run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh drag-end '#{window_id}'"
# Add/resize the sidebar after anything that changes a layout...
set-hook -g 'after-new-window[50]' 'run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh sync"'
set-hook -g 'after-new-session[50]' 'run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh sync"'
set-hook -g 'after-split-window[50]' 'run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh sync"'
set-hook -g 'after-kill-pane[50]' 'run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh sync"'
set-hook -g 'pane-exited[50]' 'run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh sync"'
set-hook -g 'window-resized[50]' 'run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh sync"'
set-hook -g 'client-attached[50]' 'run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh sync"'
# ...and redraw it right away when it comes on screen or the session list changes
set-hook -g 'client-session-changed[50]' 'run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh refresh"'
set-hook -g 'session-window-changed[50]' 'run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh refresh"'
set-hook -g 'session-closed[50]' 'run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh refresh"'
set-hook -g 'session-renamed[50]' 'run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh refresh"'
run-shell -b "~/dotfiles/tmux/scripts/sidebar.sh sync"

# Save and restore sessions
set -g @sessionx-bind 'o'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

set -g terminal-overrides ',xterm-256color:Tc:sitm@:smxx@:Rm@:Km'

# Initialize TPM (keep this line at the bottom)
run '~/.tmux/plugins/tpm/tpm'

# C-h stops at the left edge (where the sidebar is) instead of wrapping around
# to the rightmost pane. Overrides vim-tmux-navigator's binding, so it has to
# come after TPM; same vim check as the plugin.
%hidden is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "if -F '#{pane_at_left}' '' 'select-pane -L'"

