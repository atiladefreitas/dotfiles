# gruvbox-dark theme for tmux
# Matches kitty/gruvbox.conf. Owns every color + status format;
# .tmux.conf keeps behavior (position, interval, renaming).
#
#   bg0 #282828   bg1 #3c3836   bg2 #504945   bg3 #665c54   bg4 #7c6f64
#   gray #928374  fg4 #a89984   fg2 #d5c4a1   fg1 #ebdbb2   fg0 #fbf1c7
#   red #fb4934   green #b8bb26 yellow #fabd2f
#   blue #83a598  purple #d3869b aqua #8ec07c orange #fe8019

# ── Status bar ──────────────────────────────────────────────────────
# bg=default keeps the terminal's own background (and any transparency).
set -g status-style "bg=default,fg=#a89984"
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 160

# Session name: the one bright accent on the bar.
set -g status-left "#[fg=#282828,bg=#fabd2f,bold]  #S  #[fg=default,bg=default,nobold] "

set -g status-right "#[fg=#b8bb26]#(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ /') #[fg=#504945]│ #[fg=#928374]#h #[fg=#504945]│ #[fg=#d5c4a1]%a, %b %d #[fg=#504945]│ #[fg=#ebdbb2,bold]%H:%M  "

# ── Window tabs ─────────────────────────────────────────────────────
set -g window-status-format "#[fg=#928374,bg=default]  #I #W  "
set -g window-status-current-format "#[fg=#ebdbb2,bg=#504945,bold] #I #W #[fg=default,bg=default,nobold] "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#fabd2f,bg=default"
set -g window-status-bell-style "fg=#fb4934,bg=default,bold"
set -g window-status-last-style "fg=#a89984,bg=default"

# ── Panes ───────────────────────────────────────────────────────────
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"
set -g display-panes-colour "#928374"
set -g display-panes-active-colour "#fabd2f"

# ── Messages, prompts, copy mode ────────────────────────────────────
set -g message-style "fg=#ebdbb2,bg=#3c3836"
set -g message-command-style "fg=#ebdbb2,bg=#3c3836"
set -g mode-style "fg=#282828,bg=#fabd2f,bold"
set -g clock-mode-colour "#fabd2f"

# Completion menu (choose-tree, choose-session, command prompt).
set -g menu-style "fg=#ebdbb2,bg=#282828"
set -g menu-selected-style "fg=#282828,bg=#fabd2f,bold"
set -g menu-border-style "fg=#504945"
set -g popup-style "bg=default"
set -g popup-border-style "fg=#504945"
