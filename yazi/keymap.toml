[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

[[mgr.prepend_keymap]]
on = ["F"]
run = "plugin fullscreen-img"
desc = "Fullscreen image preview"

[[mgr.prepend_keymap]]
on = ["M"]
run = "plugin mount"
desc = "Open mount manager"

# what-size: calculate size of selected/hovered files
[[mgr.prepend_keymap]]
on = ["."]
run = "plugin what-size"
desc = "Calculate size of selection"

# bookmarks: save current directory as a bookmark
[[mgr.prepend_keymap]]
on = ["m"]
run = "plugin bookmarks save"
desc = "Save bookmark"

# bookmarks: jump to a bookmark
[[mgr.prepend_keymap]]
on = ["'"]
run = "plugin bookmarks jump"
desc = "Jump to bookmark"

# bookmarks: delete a bookmark
[[mgr.prepend_keymap]]
on = ["b", "d"]
run = "plugin bookmarks delete"
desc = "Delete a bookmark"

# bookmarks: delete all bookmarks
[[mgr.prepend_keymap]]
on = ["b", "D"]
run = "plugin bookmarks delete_all"
desc = "Delete all bookmarks"

# smart-enter: open files or enter directories with one key
[[mgr.prepend_keymap]]
on = ["<Enter>"]
run = "plugin smart-enter"
desc = "Enter directory or open file"
