## Lazygit — Gruvbox dark (matches kitty/gruvbox.conf + tmux/gruvbox.conf)
## Palette
##   bg0 #282828   bg1 #3c3836   bg2 #504945   bg3 #665c54   bg4 #7c6f64
##   gray #928374  fg4 #a89984   fg2 #d5c4a1   fg1 #ebdbb2   fg0 #fbf1c7
##   red #fb4934   green #b8bb26 yellow #fabd2f
##   blue #83a598  purple #d3869b aqua #8ec07c orange #fe8019
##   dim: red #cc241d green #98971a yellow #d79921 blue #458588
##        purple #b16286 aqua #689d6a orange #d65d0e
gui:
  nerdFontsVersion: "3"
  showIcons: true
  showFileTree: true
  showFileIcons: true
  showListFooter: false
  showRandomTip: false
  showBottomLine: true
  showPanelJumps: true
  showCommandLog: false
  showBranchCommitHash: false
  showDivergenceFromBaseBranch: "onlyArrow"
  border: "rounded"
  animateExplosion: true
  commandLogSize: 8
  scrollHeight: 2
  scrollPastBottom: true
  mouseEvents: true
  sidePanelWidth: 0.3333
  mainPanelSplitMode: "flexible"
  language: "auto"
  timeFormat: "02 Jan 06"
  shortTimeFormat: "3:04PM"
  expandFocusedSidePanel: false
  filterMode: "substring"
  splitDiff: "auto"
  screenMode: "normal"
  commitHashLength: 8
  commitAuthorShortLength: 2
  commitAuthorLongLength: 17
  # Gruvbox — warm, yellow-forward focus accent
  theme:
    # Bright gruvbox yellow on the focused panel — matches tmux's active pane border
    activeBorderColor:
      - "#fabd2f"
      - bold
    # Warm light-grey border on resting panels — visible, but the yellow still wins
    inactiveBorderColor:
      - "#a89984"
    # Bold orange when you're searching — unmistakable
    searchingActiveBorderColor:
      - "#fe8019"
      - bold
    # Bottom-bar keybind hints in gruvbox blue
    optionsTextColor:
      - "#83a598"
    # Warm bg2 selection — the classic gruvbox highlight
    selectedLineBgColor:
      - "#504945"
    # Softer selection bg when the panel is not focused
    inactiveViewSelectedLineBgColor:
      - "#3c3836"
    # Cherry-picked commits glow purple against bg3
    cherryPickedCommitBgColor:
      - "#665c54"
    cherryPickedCommitFgColor:
      - "#d3869b"
      - bold
    # Marked base commit (rebase) glows yellow on bg2
    markedBaseCommitBgColor:
      - "#504945"
    markedBaseCommitFgColor:
      - "#fabd2f"
      - bold
    unstagedChangesColor:
      - "#fb4934"
    defaultFgColor:
      - "#ebdbb2"
  # Let lazygit auto-color authors via hash (more visually varied than a wildcard)

  # Regex-driven branch coloring — warm gruvbox accents
  branchColorPatterns:
    "^(main|master)$": "#fabd2f" # yellow — trunk
    "^(develop|dev)$": "#83a598" # blue — integration
    "^(staging|qa|preview)$": "#d79921" # dim yellow — staging
    "^(production|prod)$": "#fb4934" # red — prod
    "^feature/": "#b8bb26" # green — features
    "^feat/": "#b8bb26"
    "^fix/": "#fe8019" # orange — fixes
    "^bugfix/": "#fe8019"
    "^hotfix/": "#fb4934" # red — hotfixes
    "^release/": "#8ec07c" # aqua — releases
    "^chore/": "#928374" # gray — chores
    "^docs/": "#8ec07c" # aqua — docs
    "^refactor/": "#458588" # dim blue — refactors
    "^test/": "#d79921" # dim yellow — tests
    "^perf/": "#b8bb26" # green — perf
    "^style/": "#d3869b" # purple — style
  # File-type icons painted in gruvbox accents.
  # Glyphs are nerd-font v3 codepoints.
  customIcons:
    filenames:
      "README.md": {icon: "", color: "#8ec07c"}
      "LICENSE": {icon: "", color: "#fabd2f"}
      "Makefile": {icon: "", color: "#fb4934"}
      "Dockerfile": {icon: "", color: "#83a598"}
      "docker-compose.yml": {icon: "", color: "#83a598"}
      ".gitignore": {icon: "", color: "#fe8019"}
      ".env": {icon: "", color: "#fabd2f"}
      "package.json": {icon: "", color: "#b8bb26"}
      "package-lock.json": {icon: "", color: "#928374"}
      "tsconfig.json": {icon: "", color: "#83a598"}
      "Cargo.toml": {icon: "", color: "#fe8019"}
      "go.mod": {icon: "", color: "#8ec07c"}
      "init.lua": {icon: "", color: "#83a598"}
      "config.yml": {icon: "", color: "#8ec07c"}
    extensions:
      ".lua": {icon: "", color: "#83a598"}
      ".ts": {icon: "", color: "#83a598"}
      ".tsx": {icon: "", color: "#8ec07c"}
      ".js": {icon: "", color: "#fabd2f"}
      ".jsx": {icon: "", color: "#8ec07c"}
      ".py": {icon: "", color: "#fabd2f"}
      ".rs": {icon: "", color: "#fe8019"}
      ".go": {icon: "", color: "#8ec07c"}
      ".rb": {icon: "", color: "#fb4934"}
      ".java": {icon: "", color: "#fe8019"}
      ".kt": {icon: "", color: "#fe8019"}
      ".swift": {icon: "", color: "#fe8019"}
      ".c": {icon: "", color: "#83a598"}
      ".cpp": {icon: "", color: "#83a598"}
      ".h": {icon: "", color: "#8ec07c"}
      ".hpp": {icon: "", color: "#8ec07c"}
      ".sh": {icon: "", color: "#b8bb26"}
      ".zsh": {icon: "", color: "#b8bb26"}
      ".bash": {icon: "", color: "#b8bb26"}
      ".md": {icon: "", color: "#8ec07c"}
      ".html": {icon: "", color: "#fe8019"}
      ".css": {icon: "", color: "#83a598"}
      ".scss": {icon: "", color: "#fb4934"}
      ".json": {icon: "", color: "#fabd2f"}
      ".jsonc": {icon: "", color: "#fabd2f"}
      ".yml": {icon: "", color: "#fb4934"}
      ".yaml": {icon: "", color: "#fb4934"}
      ".toml": {icon: "", color: "#fe8019"}
      ".conf": {icon: "", color: "#a89984"}
      ".sql": {icon: "", color: "#83a598"}
      ".vim": {icon: "", color: "#b8bb26"}
      ".lock": {icon: "", color: "#928374"}
      ".log": {icon: "", color: "#928374"}
      ".png": {icon: "", color: "#8ec07c"}
      ".jpg": {icon: "", color: "#8ec07c"}
      ".svg": {icon: "", color: "#fabd2f"}
      ".gif": {icon: "", color: "#8ec07c"}
git:
  diffRenderers:
    - colorArg: always
      # Install `delta` for syntax-highlighted diffs, then uncomment:
      # pager: delta --dark --paging=never --line-numbers --hunk-header-style="omit" --file-style="#83a598" --file-decoration-style="#3c3836 ul" --plus-style="syntax #32361a" --minus-style="syntax #3c1f1e"

      type: rawGit
  commit:
    signOff: false
    autoWrapCommitMessage: true
    autoWrapWidth: 72
  merging:
    manualCommit: false
    args: ""
  log:
    order: "topo-order"
    showGraph: "always"
    showWholeGraph: false
  skipHookPrefix: WIP
  autoFetch: true
  autoRefresh: true
  fetchAll: true
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --"
  overrideGpg: false
  disableForcePushing: false
  allBranchesLogCmds:
    - git log --graph --all --color=always --abbrev-commit --decorate --date=relative --pretty=medium
os:
  # opens in the parent nvim when lazygit runs inside nvim; plain nvim otherwise
  editPreset: "nvim-remote"
confirmOnQuit: false
quitOnTopLevelReturn: false
disableStartupPopups: true
notARepository: "prompt"
promptToReturnFromSubprocess: true
